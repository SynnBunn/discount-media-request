<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- TMI.js for Twitch Chat Integration -->
    <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #121212;
            font-family: 'Roboto', sans-serif;
        }

        /* The hidden YouTube Player */
        #player {
            position: absolute;
            top: 0; left: 0;
            width: 1px; height: 1px;
            opacity: 0; 
            pointer-events: none;
        }

        /* 1. Background Layer (Blurred Art) */
        #bg-layer {
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.4);
            z-index: 1;
            transition: background-image 0.8s ease;
        }

        /* 2. Main Content Container */
        .widget-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Align to bottom */
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }

        /* 3. Album Art (Small Square) */
        .art-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-color: #333;
            /* Hidden on very small heights, visible otherwise */
            display: none; 
        }
        
        /* Only show small art if the widget is tall enough */
        @media (min-height: 200px) {
            .art-container { display: block; }
        }

        #small-art {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* 4. Text Info Area */
        .info-area {
            margin-bottom: 20px;
            width: 100%;
            overflow: hidden;
        }

        /* Scrolling Marquee for Title */
        .track-title-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        .track-title {
            font-size: 24px;
            font-weight: 700;
            color: white;
            display: inline-block;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .channel-name {
            font-size: 14px;
            color: #b3b3b3;
            margin-top: 4px;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 5. Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .controls:hover {
            opacity: 1;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: white;
            transition: transform 0.1s;
            filter: drop-shadow(0px 1px 3px rgba(0,0,0,0.5));
        }

        button:active {
            transform: scale(0.95);
        }

        button svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        #btn-play svg {
            width: 36px;
            height: 36px;
        }

        /* Toasts & Counters */
        #status {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 100;
            display: none;
        }

        #queue-counter {
            position: absolute;
            top: 60px; right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
            display: none;
            border: 1px solid #333;
        }

        /* Marquee Animation Keyframes */
        @keyframes scroll-text {
            0% { transform: translateX(0%); }
            20% { transform: translateX(0%); } /* Pause at start */
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- Blurred Background -->
    <div id="bg-layer"></div>

    <!-- UI Elements -->
    <div id="status">Initializing...</div>
    <div id="queue-counter">Queue: 0</div>

    <div class="widget-container">
        
        <div class="art-container">
            <div id="small-art"></div>
        </div>

        <div class="info-area">
            <div class="track-title-container" id="title-container">
                <span id="track-title" class="track-title">Loading...</span>
            </div>
            <div id="channel-name" class="channel-name"></div>
        </div>

        <div class="controls">
            <button id="btn-prev" onclick="prevTrack()" title="Previous">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            
            <button id="btn-play" onclick="togglePlay()" title="Play/Pause">
                <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <svg id="icon-play" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
            </button>
            
            <button id="btn-next" onclick="nextTrack()" title="Next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Hidden Player -->
    <div id="player"></div>

    <script>
        // --- CONFIGURATION ---
        const urlParams = new URLSearchParams(window.location.search);
        const playlistId = urlParams.get('list') || 'PLRBp0Fe2GpgnIh0AiYKh7o7HnYAej-5ph'; 
        const volume = parseInt(urlParams.get('vol')) || 30;
        const shuffle = urlParams.get('shuffle') !== '0';
        const twitchChannel = urlParams.get('twitch'); // e.g., ?twitch=ninja

        // --- QUEUE SYSTEM ---
        let twitchQueue = [];
        let isPlayingQueue = false;

        // --- YOUTUBE API ---
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isPlaying = false;

        function onYouTubeIframeAPIReady() {
            if (window.location.protocol === 'file:') {
                showStatus("Warning: Running locally. Use GitHub Pages for best results.");
                setTimeout(hideStatus, 5000);
            }
            
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'listType': 'playlist',
                    'list': playlistId,
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playsinline': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });

            // Init Twitch if channel provided
            if (twitchChannel) {
                initTwitch();
            }
        }

        function onPlayerReady(event) {
            event.target.setVolume(volume);

            if (shuffle) {
                event.target.setShuffle(true);
                event.target.playVideoAt(0);
            } else {
                event.target.playVideo();
            }

            // Autoplay Check
            setTimeout(() => {
                if (!isPlaying) {
                    showStatus("Autoplay blocked. Click to start.", true);
                    document.body.addEventListener('click', () => {
                        player.playVideo();
                        hideStatus();
                    }, { once: true });
                }
            }, 3000);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updateUI();
                hideStatus();
            } 
            else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updateUI();
            }
            else if (event.data === YT.PlayerState.ENDED) {
                // --- QUEUE LOGIC TRIGGER ---
                handleTrackEnd();
            }
        }

        function handleTrackEnd() {
            if (twitchQueue.length > 0) {
                // Play next from twitch queue
                isPlayingQueue = true;
                let nextVid = twitchQueue.shift();
                player.loadVideoById(nextVid);
                updateQueueUI();
            } else if (isPlayingQueue) {
                // Queue is empty, revert back to default playlist
                isPlayingQueue = false;
                player.loadPlaylist({
                    list: playlistId,
                    listType: 'playlist'
                });
            } else {
                // Normal playlist loop behavior
                player.nextVideo();
            }
        }

        function onPlayerError(event) {
            let msg = "Error " + event.data;
            if (event.data === 150 || event.data === 101) msg = "Video blocked by owner.";
            showStatus(msg);
            
            // If we hit an error, skip to the next track automatically after 3s
            setTimeout(() => {
                hideStatus();
                handleTrackEnd(); 
            }, 3000);
        }

        // --- TWITCH INTEGRATION ---
        function initTwitch() {
            const client = new tmi.Client({
                channels: [ twitchChannel ]
            });

            client.connect().then(() => {
                showStatus(`Twitch Connected: ${twitchChannel}`);
                setTimeout(hideStatus, 3000);
            }).catch(console.error);

            client.on('message', (channel, tags, message, self) => {
                if (self) return;

                if (message.toLowerCase().startsWith('!sr ')) {
                    const query = message.substring(4).trim();
                    const videoId = extractYouTubeID(query);
                    
                    if (videoId) {
                        twitchQueue.push(videoId);
                        updateQueueUI();
                        
                        // Briefly show a confirmation toast
                        showStatus(`Added to Queue!`, false, '#22c55e');
                        setTimeout(hideStatus, 2000);
                    }
                }
            });
        }

        function extractYouTubeID(url) {
            url = url.trim();
            // If user just pastes the 11 character ID directly
            if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
            
            // Regex for standard YouTube URLs
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // --- UI LOGIC ---
        function updateUI() {
            const iconPause = document.getElementById('icon-pause');
            const iconPlay = document.getElementById('icon-play');
            
            if (isPlaying) {
                iconPause.style.display = 'block';
                iconPlay.style.display = 'none';
            } else {
                iconPause.style.display = 'none';
                iconPlay.style.display = 'block';
            }

            try {
                const data = player.getVideoData();
                if (data) {
                    const titleEl = document.getElementById('track-title');
                    titleEl.innerText = data.title;
                    document.getElementById('channel-name').innerText = data.author || (isPlayingQueue ? "Twitch Song Request" : "");

                    checkMarquee(titleEl);

                    const videoId = data.video_id;
                    const highResUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                    
                    document.getElementById('bg-layer').style.backgroundImage = `url('${highResUrl}')`;
                    document.getElementById('small-art').style.backgroundImage = `url('${highResUrl}')`;
                }
            } catch(e) { console.error(e); }
        }

        function updateQueueUI() {
            const counter = document.getElementById('queue-counter');
            if (twitchQueue.length > 0) {
                counter.innerText = `Queue: ${twitchQueue.length}`;
                counter.style.display = 'block';
            } else {
                counter.style.display = 'none';
            }
        }

        function checkMarquee(element) {
            element.style.animation = 'none';
            element.style.transform = 'translateX(0)';
            
            const containerWidth = document.getElementById('title-container').offsetWidth;
            const textWidth = element.scrollWidth;

            if (textWidth > containerWidth) {
                const duration = textWidth / 50; 
                element.style.animation = `scroll-text ${duration}s linear infinite alternate`;
            }
        }

        // --- CONTROLS ---
        function togglePlay() {
            if (!player) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function nextTrack() {
            if (!player) return;
            handleTrackEnd(); // Use the same logic as if the track ended naturally
        }

        function prevTrack() {
            if (player) player.previousVideo();
            // Note: going backward while deep in a dynamic Twitch Queue is tricky in the iframe API, 
            // so this mostly safely applies to normal playlist behavior.
        }

        function showStatus(msg, persistent = false, bgColor = 'rgba(220, 38, 38, 0.9)') {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.style.background = bgColor;
            el.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            if(player) updateUI();
        });
    </script>
</body>
</html>
