<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- TMI.js for Twitch Chat Integration (Switched to cdnjs to avoid adblockers) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tmi.js/1.8.5/tmi.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: transparent; 
            font-family: 'Roboto', sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 10px;
            box-sizing: border-box;
        }

        #player {
            position: absolute;
            top: 0; left: 0;
            width: 1px; height: 1px;
            opacity: 0; 
            pointer-events: none;
        }

        /* Widget Wrapper */
        .widget-wrapper {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Main Compact Widget Card */
        .player-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transition: border-radius 0.3s ease;
        }

        /* Album Art Square */
        .art-container {
            width: 76px;
            height: 76px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            background-color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }

        #small-art {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease;
        }

        /* Text Info Area */
        .info-area {
            flex-grow: 1;
            min-width: 0;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-title-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        .track-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            display: inline-block;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        .channel-name {
            font-size: 13px;
            color: #a0a0a0;
            margin-top: 5px;
            font-weight: 400;
        }

        /* Badge inside info area */
        .source-badge {
            display: inline-block;
            background: #9146FF;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            vertical-align: middle;
            display: none; /* Only show when playing a requested song */
        }

        /* Controls */
        .controls {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 5px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            padding: 8px;
            color: white;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        button svg { width: 20px; height: 20px; fill: white; }
        #btn-play { padding: 12px; background: rgba(255, 255, 255, 0.1); }
        #btn-play svg { width: 24px; height: 24px; }

        /* --- VISUAL QUEUE --- */
        .queue-container {
            width: 95%; /* Slightly narrower than main card */
            margin: 0 auto;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 15px 12px 12px 12px;
            box-sizing: border-box;
            display: none; /* hidden by default */
            flex-direction: column;
            gap: 8px;
            z-index: 5;
            transform: translateY(-10px); /* Pull it up under the card slightly */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .queue-header {
            font-size: 11px;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 2px;
            margin-left: 4px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 6px 10px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }

        .queue-thumb {
            width: 48px;
            height: 36px;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
        }

        .queue-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
            flex-grow: 1;
        }

        .queue-title {
            font-size: 13px;
            color: white;
            text-overflow: ellipsis;
            overflow: hidden;
            font-weight: 700;
        }

        .queue-user {
            font-size: 11px;
            color: #9146FF;
            margin-top: 2px;
        }

        /* Status Toasts */
        #status {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.95);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
            display: none;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @keyframes scroll-text {
            0% { transform: translateX(0%); }
            20% { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="status">Initializing...</div>

    <div class="widget-wrapper">
        <div class="player-card" id="player-card">
            
            <div class="art-container">
                <div id="small-art"></div>
            </div>

            <div class="info-area">
                <div class="track-title-container" id="title-container">
                    <span id="track-title" class="track-title">Loading...</span>
                </div>
                <div class="channel-name">
                    <span class="source-badge" id="source-badge">REQUEST</span>
                    <span id="channel-name">Connecting...</span>
                </div>
            </div>

            <div class="controls">
                <button id="btn-prev" onclick="prevTrack()" title="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <button id="btn-play" onclick="togglePlay()" title="Play/Pause">
                    <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <svg id="icon-play" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
                </button>
                
                <button id="btn-next" onclick="nextTrack()" title="Skip / Next">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Visual Queue Container -->
        <div class="queue-container" id="queue-container">
            <div class="queue-header">Up Next</div>
            <div id="queue-list">
                <!-- Items inject here -->
            </div>
        </div>
    </div>

    <!-- Hidden Player -->
    <div id="player"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playlistId = urlParams.get('list') || 'PLRBp0Fe2GpgnIh0AiYKh7o7HnYAej-5ph'; 
        const volume = parseInt(urlParams.get('vol')) || 30;
        const shuffle = urlParams.get('shuffle') !== '0';
        const twitchChannel = urlParams.get('twitch');

        console.log("[Player] Init variables: ", {playlistId, volume, shuffle, twitchChannel});

        // Queue System (Now stores objects: {id, title, reqBy, thumb})
        let twitchQueue = [];
        let isPlayingQueue = false;

        // YouTube API Init
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isPlaying = false;

        function onYouTubeIframeAPIReady() {
            console.log("[Player] YouTube Iframe API Ready.");
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'listType': 'playlist',
                    'list': playlistId,
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playsinline': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });

            if (twitchChannel) {
                initTwitch();
            } else {
                console.log("[Twitch] No twitchChannel found in URL parameters.");
            }
        }

        function onPlayerReady(event) {
            console.log("[Player] Player Ready.");
            event.target.setVolume(volume);
            if (shuffle) {
                event.target.setShuffle(true);
                event.target.playVideoAt(0);
            } else {
                event.target.playVideo();
            }

            setTimeout(() => {
                if (!isPlaying) {
                    showStatus("Autoplay blocked. Click to start.", true);
                    document.body.addEventListener('click', () => {
                        player.playVideo();
                        hideStatus();
                    }, { once: true });
                }
            }, 3000);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updateUI();
                hideStatus();
            } 
            else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updateUI();
            }
            else if (event.data === YT.PlayerState.ENDED) {
                console.log("[Player] Track Ended Naturally.");
                handleTrackEnd();
            }
        }

        function handleTrackEnd() {
            if (twitchQueue.length > 0) {
                console.log("[Player] Playing from Twitch Queue.");
                isPlayingQueue = true;
                let nextSong = twitchQueue.shift(); // Pull the first object out of queue
                player.loadVideoById(nextSong.id);
                renderQueueUI();
            } else if (isPlayingQueue) {
                console.log("[Player] Queue Finished. Returning to default playlist.");
                // Queue finished, return to default background list
                isPlayingQueue = false;
                player.loadPlaylist({
                    list: playlistId,
                    listType: 'playlist'
                });
            } else {
                console.log("[Player] Next standard playlist video.");
                player.nextVideo();
            }
        }

        function onPlayerError(event) {
            console.error("[Player] YouTube Player Error Code: ", event.data);
            let msg = "Error " + event.data;
            if (event.data === 150 || event.data === 101) msg = "Video blocked by owner. Skipping...";
            showStatus(msg);
            setTimeout(() => {
                hideStatus();
                handleTrackEnd(); 
            }, 3000);
        }

        // --- TWITCH INTEGRATION & ROBUST EXTRACTION ---
        let twitchLoadAttempts = 0;
        
        function initTwitch() {
            // Safeguard: Check if the tmi.js script has completely loaded
            if (typeof tmi === 'undefined') {
                twitchLoadAttempts++;
                if (twitchLoadAttempts > 10) {
                    console.error("[Twitch] Failed to load tmi.js after multiple attempts. Blocked by browser?");
                    showStatus("Twitch script blocked by browser or adblocker.", true);
                    return;
                }
                console.warn(`[Twitch] tmi.js is not loaded yet. Waiting 500ms to retry... (${twitchLoadAttempts}/10)`);
                setTimeout(initTwitch, 500);
                return;
            }

            console.log(`[Twitch] Attempting to connect to channel: ${twitchChannel}`);
            const client = new tmi.Client({ channels: [ twitchChannel ] });

            client.connect().then(() => {
                console.log(`[Twitch] Successfully connected to: ${twitchChannel}`);
                showStatus(`Twitch Connected: ${twitchChannel}`, false, '#9146FF');
                setTimeout(hideStatus, 3000);
            }).catch(err => {
                console.error("[Twitch] Connection Error: ", err);
            });

            client.on('message', (channel, tags, message, self) => {
                if (self) return;

                if (message.toLowerCase().startsWith('!sr ')) {
                    console.log(`[Twitch] SR Command detected: ${message}`);
                    const query = message.substring(4).trim();
                    const videoId = extractYouTubeID(query);
                    
                    if (videoId) {
                        console.log(`[Twitch] Extracted Video ID: ${videoId}`);
                        addRequestToQueue(videoId, tags['display-name']);
                    } else {
                        console.warn(`[Twitch] Failed to extract YouTube ID from: ${query}`);
                        showStatus(`Invalid YouTube Link`, false, '#ef4444');
                        setTimeout(hideStatus, 3000);
                    }
                }
            });
        }

        function extractYouTubeID(url) {
            url = url.trim();
            
            // 1. Try to parse as standard URL (Handles youtu.be, watch?v=, etc)
            try {
                if (url.startsWith('http')) {
                    let u = new URL(url);
                    if (u.hostname.includes('youtube.com')) return u.searchParams.get('v');
                    if (u.hostname.includes('youtu.be')) return u.pathname.substring(1);
                }
            } catch(e) {
                // Ignore URL parsing errors and fall through to regex
            }

            // 2. Extremely robust fallback regex. 
            // It looks for exactly 11 valid characters. This perfectly solves "ID&list=..." issues.
            const rawMatch = url.match(/([a-zA-Z0-9_-]{11})/);
            if (rawMatch) return rawMatch[1];

            return null; // Failed to find anything
        }

        async function addRequestToQueue(videoId, username) {
            console.log(`[Twitch] Attempting to fetch metadata for video ID: ${videoId}`);
            try {
                // Using noembed to bypass client-side CORS issues that happen with raw YouTube oembed
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const data = await res.json();
                console.log(`[Twitch] Successfully fetched metadata: `, data);
                
                if (data.error) {
                     throw new Error(data.error);
                }
                
                // Add to internal queue
                twitchQueue.push({
                    id: videoId,
                    title: data.title || "Unknown Title",
                    author: data.author_name || "Unknown Channel",
                    reqBy: username,
                    thumb: `https://img.youtube.com/vi/${videoId}/default.jpg` // Small thumbnail
                });
                
                renderQueueUI();
                showStatus(`Added: ${data.title}`, false, '#22c55e');
                setTimeout(hideStatus, 3000);

            } catch (e) {
                console.error("[Twitch] Metadata Fetch Error: ", e);
                showStatus("Error: Video is unavailable or private", false, '#ef4444');
                setTimeout(hideStatus, 3000);
            }
        }

        // --- UI & RENDERING ---
        function updateUI() {
            const iconPause = document.getElementById('icon-pause');
            const iconPlay = document.getElementById('icon-play');
            
            if (isPlaying) {
                iconPause.style.display = 'block';
                iconPlay.style.display = 'none';
            } else {
                iconPause.style.display = 'none';
                iconPlay.style.display = 'block';
            }

            try {
                const data = player.getVideoData();
                if (data) {
                    const titleEl = document.getElementById('track-title');
                    titleEl.innerText = data.title;
                    
                    document.getElementById('channel-name').innerText = data.author || (isPlayingQueue ? "" : "YouTube Playlist");
                    document.getElementById('source-badge').style.display = isPlayingQueue ? 'inline-block' : 'none';

                    checkMarquee(titleEl);

                    const videoId = data.video_id;
                    const highResUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                    document.getElementById('small-art').style.backgroundImage = `url('${highResUrl}')`;
                }
            } catch(e) { console.error(e); }
        }

        function renderQueueUI() {
            const container = document.getElementById('queue-container');
            const list = document.getElementById('queue-list');
            const card = document.getElementById('player-card');
            
            list.innerHTML = ''; // Clear current

            if (twitchQueue.length > 0) {
                // Show up to 3 items in the visual queue
                const displayQueue = twitchQueue.slice(0, 3);
                
                displayQueue.forEach(song => {
                    const item = document.createElement('div');
                    item.className = 'queue-item';
                    item.innerHTML = `
                        <div class="queue-thumb" style="background-image: url('${song.thumb}')"></div>
                        <div class="queue-info">
                            <span class="queue-title">${song.title}</span>
                            <span class="queue-user">Req by @${song.reqBy}</span>
                        </div>
                    `;
                    list.appendChild(item);
                });

                if (twitchQueue.length > 3) {
                    const extra = document.createElement('div');
                    extra.style.fontSize = '11px';
                    extra.style.color = '#a0a0a0';
                    extra.style.textAlign = 'center';
                    extra.style.marginTop = '4px';
                    extra.innerText = `+ ${twitchQueue.length - 3} more in queue...`;
                    list.appendChild(extra);
                }

                container.style.display = 'flex';
                card.style.borderRadius = '16px 16px 0 0'; // Flatten bottom corners of card
            } else {
                container.style.display = 'none';
                card.style.borderRadius = '16px'; // Restore rounded corners
            }
        }

        function checkMarquee(element) {
            element.style.animation = 'none';
            element.style.transform = 'translateX(0)';
            
            const containerWidth = document.getElementById('title-container').offsetWidth;
            const textWidth = element.scrollWidth;

            if (textWidth > containerWidth + 5) {
                const duration = textWidth / 40; 
                element.style.animation = `scroll-text ${duration}s linear infinite alternate`;
            }
        }

        // --- CONTROLS ---
        function togglePlay() {
            if (!player) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function nextTrack() {
            if (!player) return;
            handleTrackEnd(); // Triggers the exact same priority logic as a natural song end
        }

        function prevTrack() {
            if (player) player.previousVideo();
        }

        function showStatus(msg, persistent = false, bgColor = 'rgba(220, 38, 38, 0.9)') {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.style.background = bgColor;
            el.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        window.addEventListener('resize', () => { if(player) updateUI(); });
    </script>
</body>
</html>
